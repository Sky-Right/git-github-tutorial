  <script src="../theme/vendor/remark-0.14.1.min.js"></script>
  <script>
    window.slideshow = remark.create({
      ratio: '16:9',
      highlightStyle: 'github',
      highlightLines: true,
      countIncrementalSlides: false,
      slideNumberFormat: '%current% / %total%',
      navigation: { scroll: false }
    });
    // Print each logical slide once, with all reveal steps completed.
    var containers = document.querySelectorAll('.remark-slide-container');
    slideshow.getSlides().forEach(function (slide, index) {
      if (slide.properties.continued === 'true') containers[index - 1].classList.add('print-hidden');
    });
  </script>
