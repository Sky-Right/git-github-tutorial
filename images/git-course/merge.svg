<svg xmlns="http://www.w3.org/2000/svg" width="700" height="465" viewBox="0 0 700 465" role="img" aria-labelledby="title desc"><title id="title">A merge commit joins the two histories at M</title><desc id="desc">A merge commit joins the two histories at M</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#182230;font-size:26px} .muted{fill:#566479;font-size:23px}.mono{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-size:23px}.heading{font-size:27px;font-weight:650}.small{font-size:21px}.line{fill:none;stroke:#C8D1DD;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style><text x="8" y="25" class="muted" text-anchor="start">Before</text><path d="M35 135L215 135" fill="none" stroke="#182230" stroke-width="4" stroke-linecap="round"/><path d="M215 135 C260 135 260 65 305 65" fill="none" stroke="#6654C0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M215 135L305 135" fill="none" stroke="#182230" stroke-width="4" stroke-linecap="round"/><circle cx="35" cy="135" r="12" fill="#182230" stroke="#fff" stroke-width="3"/><text x="35" y="178" class="mono" text-anchor="middle" style="fill:#182230">A</text><circle cx="125" cy="135" r="12" fill="#182230" stroke="#fff" stroke-width="3"/><text x="125" y="178" class="mono" text-anchor="middle" style="fill:#182230">B</text><circle cx="215" cy="135" r="12" fill="#182230" stroke="#fff" stroke-width="3"/><text x="215" y="178" class="mono" text-anchor="middle" style="fill:#182230">C</text><circle cx="305" cy="65" r="12" fill="#6654C0" stroke="#fff" stroke-width="3"/><text x="305" y="108" class="mono" text-anchor="middle" style="fill:#6654C0">D</text><circle cx="305" cy="135" r="12" fill="#182230" stroke="#fff" stroke-width="3"/><text x="305" y="178" class="mono" text-anchor="middle" style="fill:#182230">E</text><text x="450" y="76" class="mono small" text-anchor="start" style="fill:#087F8C">HEAD → main</text><text x="450" y="112" class="mono small" text-anchor="start" style="fill:#182230">main → E</text><text x="450" y="148" class="mono small" text-anchor="start" style="fill:#6654C0">add-footer → D</text><text x="8" y="209" class="mono small" text-anchor="start" style="fill:#566479">E adds a description to README.md. The footer is on D.</text><text x="8" y="260" class="muted" text-anchor="start">After</text><path d="M35 370L215 370" fill="none" stroke="#182230" stroke-width="4" stroke-linecap="round"/><path d="M215 370 C260 370 260 300 305 300" fill="none" stroke="#6654C0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M215 370L305 370" fill="none" stroke="#182230" stroke-width="4" stroke-linecap="round"/><path d="M305 370L405 370" fill="none" stroke="#182230" stroke-width="4" stroke-linecap="round"/><path d="M305 300 C350 300 350 370 405 370" fill="none" stroke="#6654C0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="35" cy="370" r="12" fill="#182230" stroke="#fff" stroke-width="3"/><text x="35" y="413" class="mono" text-anchor="middle" style="fill:#182230">A</text><circle cx="125" cy="370" r="12" fill="#182230" stroke="#fff" stroke-width="3"/><text x="125" y="413" class="mono" text-anchor="middle" style="fill:#182230">B</text><circle cx="215" cy="370" r="12" fill="#182230" stroke="#fff" stroke-width="3"/><text x="215" y="413" class="mono" text-anchor="middle" style="fill:#182230">C</text><circle cx="305" cy="300" r="12" fill="#6654C0" stroke="#fff" stroke-width="3"/><text x="305" y="343" class="mono" text-anchor="middle" style="fill:#6654C0">D</text><circle cx="305" cy="370" r="12" fill="#182230" stroke="#fff" stroke-width="3"/><text x="305" y="413" class="mono" text-anchor="middle" style="fill:#182230">E</text><circle cx="405" cy="370" r="12" fill="#237759" stroke="#fff" stroke-width="3"/><text x="405" y="413" class="mono" text-anchor="middle" style="fill:#237759">M</text><text x="450" y="311" class="mono small" text-anchor="start" style="fill:#087F8C">HEAD → main</text><text x="450" y="347" class="mono small" text-anchor="start" style="fill:#182230">main → M</text><text x="450" y="383" class="mono small" text-anchor="start" style="fill:#6654C0">add-footer → D</text><text x="8" y="444" class="mono small" text-anchor="start" style="fill:#566479">M contains both edits. Its parents are E and D.</text></svg>
