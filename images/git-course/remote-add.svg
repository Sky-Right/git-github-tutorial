<svg xmlns="http://www.w3.org/2000/svg" width="700" height="465" viewBox="0 0 700 465" role="img" aria-labelledby="title desc"><title id="title">Adding origin records the remote URL; it uploads no commits</title><desc id="desc">Adding origin records the remote URL; it uploads no commits. Earlier history is abbreviated by an ellipsis. HEAD names the current local branch. GitHub has its own branch references.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#182230;font-size:26px} .muted{fill:#566479;font-size:23px}.mono{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-size:23px}.heading{font-size:27px;font-weight:650}.small{font-size:21px}.line{fill:none;stroke:#C8D1DD;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style><text x="350" y="25" class="muted" text-anchor="middle">Before</text><text x="10" y="32" class="heading" text-anchor="start">Local</text><text x="10" y="65" class="mono small" text-anchor="start" style="fill:#087F8C">HEAD → main → M</text><text x="12" y="170" class="mono" text-anchor="start" style="fill:#566479">…</text><path d="M45 162L160 162" fill="none" stroke="#182230" stroke-width="4" stroke-linecap="round"/><circle cx="160" cy="162" r="12" fill="#182230" stroke="#fff" stroke-width="3"/><text x="160" y="205" class="mono" text-anchor="middle" style="fill:#182230">M</text><text x="390" y="32" class="heading" text-anchor="start">GitHub</text><text x="392" y="128" class="muted" text-anchor="start">No commits</text><text x="350" y="260" class="muted" text-anchor="middle">After</text><text x="10" y="267" class="heading" text-anchor="start">Local</text><text x="10" y="300" class="mono small" text-anchor="start" style="fill:#087F8C">HEAD → main → M</text><text x="12" y="405" class="mono" text-anchor="start" style="fill:#566479">…</text><path d="M45 397L160 397" fill="none" stroke="#182230" stroke-width="4" stroke-linecap="round"/><circle cx="160" cy="397" r="12" fill="#182230" stroke="#fff" stroke-width="3"/><text x="160" y="440" class="mono" text-anchor="middle" style="fill:#182230">M</text><text x="390" y="267" class="heading" text-anchor="start">GitHub</text><text x="392" y="363" class="muted" text-anchor="start">No commits</text><text x="10" y="123" class="mono small" text-anchor="start" style="fill:#566479">origin: not configured</text><text x="10" y="358" class="mono small" text-anchor="start" style="fill:#087F8C">origin: GitHub URL</text></svg>
