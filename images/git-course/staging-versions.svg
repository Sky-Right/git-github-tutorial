<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="240" viewBox="0 0 1080 240" role="img" aria-labelledby="title desc"><title id="title">The next commit uses staged v2 even if the working file has become v3</title><desc id="desc">The next commit uses staged v2 even if the working file has become v3</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#182230;font-size:26px} .muted{fill:#566479;font-size:23px}.mono{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-size:23px}.heading{font-size:27px;font-weight:650}.small{font-size:21px}.line{fill:none;stroke:#C8D1DD;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style><rect x="2" y="30" width="300" height="175" rx="4" fill="#FFFFFF" stroke="#C8D1DD" stroke-width="2"/><text x="20" y="70" class="heading" text-anchor="start">Working directory</text><text x="20" y="120" class="mono" text-anchor="start">index.html</text><text x="20" y="170" class="heading" text-anchor="start" style="fill:#182230">v3</text><rect x="372" y="30" width="300" height="175" rx="4" fill="#FFFFFF" stroke="#C8D1DD" stroke-width="2"/><text x="390" y="70" class="heading" text-anchor="start">Staging area</text><text x="390" y="120" class="mono" text-anchor="start">index.html</text><text x="390" y="170" class="heading" text-anchor="start" style="fill:#087F8C">v2</text><rect x="742" y="30" width="300" height="175" rx="4" fill="#FFFFFF" stroke="#C8D1DD" stroke-width="2"/><text x="760" y="70" class="heading" text-anchor="start">Next commit</text><text x="760" y="120" class="mono" text-anchor="start">index.html</text><text x="760" y="170" class="heading" text-anchor="start" style="fill:#087F8C">v2</text></svg>
