<svg xmlns="http://www.w3.org/2000/svg" width="700" height="465" viewBox="0 0 700 465" role="img" aria-labelledby="title desc"><title id="title">The GitHub merge-commit option creates Q with parents N and P; local branches have not moved</title><desc id="desc">The GitHub merge-commit option creates Q with parents N and P; local branches have not moved. Earlier history is abbreviated by an ellipsis. HEAD names the current local branch. GitHub has its own branch references.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#182230;font-size:26px} .muted{fill:#566479;font-size:23px}.mono{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-size:23px}.heading{font-size:27px;font-weight:650}.small{font-size:21px}.line{fill:none;stroke:#C8D1DD;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style><text x="350" y="25" class="muted" text-anchor="middle">Before</text><text x="10" y="32" class="heading" text-anchor="start">Local</text><text x="10" y="65" class="mono small" text-anchor="start" style="fill:#087F8C">HEAD → improve-readme → P</text><text x="10" y="94" class="mono small" text-anchor="start" style="fill:#182230">main → N</text><text x="10" y="123" class="mono small" text-anchor="start" style="fill:#BA502B">origin/main → N</text><path d="M65 162L245 162" fill="none" stroke="#6654C0" stroke-width="4" stroke-linecap="round"/><circle cx="65" cy="162" r="12" fill="#182230" stroke="#fff" stroke-width="3"/><text x="65" y="205" class="mono" text-anchor="middle" style="fill:#182230">N</text><circle cx="245" cy="162" r="12" fill="#6654C0" stroke="#fff" stroke-width="3"/><text x="245" y="205" class="mono" text-anchor="middle" style="fill:#6654C0">P</text><text x="390" y="32" class="heading" text-anchor="start">GitHub</text><text x="390" y="65" class="mono small" text-anchor="start" style="fill:#182230">main → N</text><text x="390" y="94" class="mono small" text-anchor="start" style="fill:#6654C0">improve-readme → P</text><path d="M445 162L625 162" fill="none" stroke="#6654C0" stroke-width="4" stroke-linecap="round"/><circle cx="445" cy="162" r="12" fill="#182230" stroke="#fff" stroke-width="3"/><text x="445" y="205" class="mono" text-anchor="middle" style="fill:#182230">N</text><circle cx="625" cy="162" r="12" fill="#6654C0" stroke="#fff" stroke-width="3"/><text x="625" y="205" class="mono" text-anchor="middle" style="fill:#6654C0">P</text><text x="350" y="260" class="muted" text-anchor="middle">After</text><text x="10" y="267" class="heading" text-anchor="start">Local</text><text x="10" y="300" class="mono small" text-anchor="start" style="fill:#087F8C">HEAD → improve-readme → P</text><text x="10" y="329" class="mono small" text-anchor="start" style="fill:#182230">main → N</text><text x="10" y="358" class="mono small" text-anchor="start" style="fill:#BA502B">origin/main → N</text><path d="M65 397L245 397" fill="none" stroke="#6654C0" stroke-width="4" stroke-linecap="round"/><circle cx="65" cy="397" r="12" fill="#182230" stroke="#fff" stroke-width="3"/><text x="65" y="440" class="mono" text-anchor="middle" style="fill:#182230">N</text><circle cx="245" cy="397" r="12" fill="#6654C0" stroke="#fff" stroke-width="3"/><text x="245" y="440" class="mono" text-anchor="middle" style="fill:#6654C0">P</text><text x="390" y="267" class="heading" text-anchor="start">GitHub</text><text x="390" y="300" class="mono small" text-anchor="start" style="fill:#182230">main → Q</text><text x="390" y="329" class="mono small" text-anchor="start" style="fill:#6654C0">improve-readme → P</text><path d="M430 398L665 398" fill="none" stroke="#182230" stroke-width="4" stroke-linecap="round"/><path d="M430 398 C480 398 510 350 560 350 C615 350 615 398 665 398" fill="none" stroke="#6654C0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="430" cy="398" r="12" fill="#182230" stroke="#fff" stroke-width="3"/><text x="430" y="441" class="mono" text-anchor="middle" style="fill:#182230">N</text><circle cx="560" cy="350" r="12" fill="#6654C0" stroke="#fff" stroke-width="3"/><text x="560" y="393" class="mono" text-anchor="middle" style="fill:#6654C0">P</text><circle cx="665" cy="398" r="12" fill="#237759" stroke="#fff" stroke-width="3"/><text x="665" y="441" class="mono" text-anchor="middle" style="fill:#237759">Q</text></svg>
