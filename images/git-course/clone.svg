<svg xmlns="http://www.w3.org/2000/svg" width="700" height="410" viewBox="0 0 700 410" role="img" aria-labelledby="title desc"><title id="title">Clone creates a new folder with working files, Git history and origin</title><desc id="desc">Clone creates a new folder with working files, Git history and origin</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#182230;font-size:26px} .muted{fill:#566479;font-size:23px}.mono{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-size:23px}.heading{font-size:27px;font-weight:650}.small{font-size:21px}.line{fill:none;stroke:#C8D1DD;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style><text x="20" y="35" class="heading" text-anchor="start">New local folder</text><text x="20" y="100" class="mono" text-anchor="start" style="fill:#182230">my-first-project/</text><text x="20" y="137" class="mono" text-anchor="start" style="fill:#182230">  README.md</text><text x="20" y="174" class="mono" text-anchor="start" style="fill:#182230">  index.html</text><text x="20" y="211" class="mono" text-anchor="start" style="fill:#182230">  style.css</text><text x="20" y="248" class="mono" text-anchor="start" style="fill:#6654C0">  .git/</text><text x="395" y="35" class="heading" text-anchor="start">GitHub</text><text x="395" y="105" class="mono" text-anchor="start">main → M</text><circle cx="535" cy="160" r="12" fill="#6654C0" stroke="#fff" stroke-width="3"/><text x="535" y="203" class="mono" text-anchor="middle" style="fill:#6654C0">M</text><path d="M390 245L275 245" fill="none" stroke="#087F8C" stroke-width="4" stroke-linecap="round"/><path d="M285 238L275 245L285 252" fill="none" stroke="#087F8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="540" y="280" class="mono" text-anchor="middle" style="fill:#087F8C">clone</text><text x="20" y="335" class="mono" text-anchor="start">HEAD → main → M</text><text x="20" y="375" class="mono" text-anchor="start" style="fill:#BA502B">origin/main → M</text></svg>
